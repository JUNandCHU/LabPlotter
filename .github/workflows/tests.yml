name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r web/requirements.txt
      - run: python -m unittest discover -s tests -p "test_web.py" -v
      - run: python web/smoke_test.py
      - run: |
          python -m streamlit run web/streamlit_app.py --server.headless true --server.port 8501 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
